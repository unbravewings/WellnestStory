<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>7 Days Wellnest Story Quest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Thai:wght@600;700&family=Noto+Sans+Thai:wght@400;500;700&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<script src="quests-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root{
    --sage:#3F6350;
    --sage-light:#5C8770;
    --cream:#F1ECE3;
    --coral:#E2704F;
    --gold:#D9A441;
    --char:#241F19;
    --muted:#948B7C;
    --peach:#F6D9AC;
    --peach-strong:#E8A252;
    --mint:#D7E7C6;
    --mint-strong:#7FA868;
    --grey-circle:#DAD4C8;
    --mono:'Space Mono','Courier New',monospace;
  }
  .theme-eating{--accent-soft:var(--peach);--accent-strong:var(--peach-strong);}
  .theme-activity{--accent-soft:var(--mint);--accent-strong:var(--mint-strong);}
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--cream);color:var(--char);
    font-family:'Noto Sans Thai','Segoe UI',sans-serif;min-height:100vh;
  }
  .wrap{max-width:480px;margin:0 auto;padding:26px 18px 60px;}
  .top-row{display:flex;justify-content:space-between;align-items:flex-start;}
  .top-row img{width:52px;height:52px;object-fit:contain;border-radius:50%;background:#fff;padding:6px;border:1px solid #ece2d0;}
  .eyebrow{font-size:12px;letter-spacing:1px;font-weight:700;margin:0;text-transform:uppercase;color:var(--coral);}
  h1.heading{font-family:'Noto Serif Thai',serif;font-size:26px;font-weight:700;margin:4px 0 0;}
  .streak-header{
    display:flex;align-items:center;gap:6px;margin-top:20px;
    font-family:var(--mono);font-size:13px;color:var(--sage);font-weight:700;
  }
  .pet-section{display:flex;flex-direction:column;align-items:center;margin-top:18px;}
  .pet-frame{position:relative;width:180px;height:180px;}
  .pet-body{
    position:absolute;left:50%;top:50%;
    transform:translate(-50%,-50%);
    font-family:var(--mono);font-weight:700;white-space:nowrap;
    transition:font-size .4s,color .4s;
  }
  .pet-caption{text-align:center;margin-top:10px;}
  .pet-stage-name{font-family:'Noto Serif Thai',serif;font-weight:700;font-size:16px;color:var(--char);}
  .pet-progress-text{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:2px;}
  .pet-streak-line{font-family:var(--mono);font-size:12px;color:var(--sage);margin-top:6px;}
  .share-pet-btn{
    margin-top:14px;background:none;border:1.5px solid var(--sage);color:var(--sage);
    font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px;cursor:pointer;font-family:inherit;
  }
  .share-overlay{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    flex-direction:column;align-items:center;justify-content:center;
    padding:20px;z-index:60;gap:14px;overflow-y:auto;
  }
  .share-overlay.show{display:flex;}
  .share-preview-wrap{
    width:min(78vw,260px);aspect-ratio:9/16;overflow:hidden;
    position:relative;border-radius:20px;flex-shrink:0;
  }
  .share-card{
    position:absolute;top:0;left:0;width:360px;height:640px;
    background:linear-gradient(160deg, var(--peach) 0%, var(--mint) 100%);
    border-radius:20px;box-sizing:border-box;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:40px 30px;transform-origin:top left;
  }
  .share-card img{width:56px;height:56px;object-fit:contain;border-radius:50%;background:#fff;padding:8px;margin-bottom:20px;box-shadow:0 1px 4px rgba(36,31,25,0.1);}
  .share-card .sc-progress{color:var(--char);font-family:var(--mono);font-size:15px;margin-top:22px;text-align:center;line-height:1.6;}
  .share-card .sc-brand{color:var(--coral);font-family:var(--mono);font-size:12px;letter-spacing:1.5px;margin-top:28px;font-weight:700;}
  .download-share-btn{
    width:min(78vw,260px);padding:14px;border-radius:10px;border:none;
    background:var(--coral);color:#fff;font-weight:700;font-size:14px;cursor:pointer;
    font-family:inherit;flex-shrink:0;
  }
  .close-hint{color:#fff;font-size:12.5px;flex-shrink:0;}
  .quest-card{
    border-radius:22px;padding:22px;margin-top:16px;
    border:none;cursor:pointer;transition:box-shadow .15s;
    box-shadow:0 1px 4px rgba(36,31,25,0.06);
  }
  .quest-card:hover{box-shadow:0 4px 14px rgba(0,0,0,0.06);}
  .quest-card.eating-idle,.quest-card.eating-active{background:var(--peach);}
  .quest-card.activity-idle,.quest-card.activity-active{background:var(--mint);}
  .quest-card.eating-done{background:var(--peach-strong);}
  .quest-card.activity-done{background:var(--mint-strong);}
  .quest-card .cat-label{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
  .quest-card.eating-done .cat-label,.quest-card.activity-done .cat-label{color:rgba(255,255,255,0.75);}
  .quest-card .cat-title{font-family:'Noto Serif Thai',serif;font-size:19px;font-weight:700;margin:4px 0 2px;color:var(--char);}
  .quest-card.eating-done .cat-title,.quest-card.activity-done .cat-title{color:#fff;}
  .quest-card .cat-sub{font-size:12.5px;color:var(--muted);}
  .quest-text{font-size:15px;line-height:1.5;margin-top:10px;color:var(--char);}
  .quest-card.eating-done .quest-text,.quest-card.activity-done .quest-text{color:#fff;}
  .quest-tag{
    display:inline-block;font-size:11px;font-weight:700;color:var(--char);
    background:#fff;padding:3px 9px;border-radius:999px;margin-top:8px;
  }
  .quest-card.eating-done .quest-tag,.quest-card.activity-done .quest-tag{background:rgba(255,255,255,0.25);color:#fff;}
  .complete-row{display:flex;align-items:center;gap:8px;margin-top:14px;}
  .complete-btn{
    padding:8px 14px;border-radius:8px;border:1.5px solid var(--char);
    background:transparent;color:var(--char);font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;
  }
  .complete-btn.done-state{border-color:#fff;color:#fff;}
  .countdown{
    font-family:var(--mono);font-size:11.5px;color:var(--muted);
    margin-top:10px;letter-spacing:.5px;
  }
  .quest-card.eating-done .countdown,.quest-card.activity-done .countdown{color:rgba(255,255,255,0.75);}
  .screen{display:none;}
  .screen.active{display:block;}
  .back-btn{
    background:none;border:none;color:var(--muted);font-size:13px;cursor:pointer;
    padding:0;margin-bottom:14px;font-family:inherit;
  }
  .subcat-btn{
    width:100%;text-align:left;background:var(--accent-soft,#fff);border:none;border-radius:18px;
    padding:16px;margin-top:10px;cursor:pointer;font-family:inherit;
    box-shadow:0 1px 4px rgba(36,31,25,0.06);transition:box-shadow .15s;
  }
  .subcat-btn:hover{box-shadow:0 3px 10px rgba(36,31,25,0.1);}
  .subcat-btn .name{font-weight:700;font-size:15px;color:var(--char);}
  .subcat-btn .desc{font-size:12px;color:var(--char);opacity:0.65;margin-top:3px;}
  .reveal-card{
    background:var(--accent-strong,var(--sage));border-radius:22px;padding:24px;margin-top:16px;text-align:center;
  }
  .reveal-tag{color:rgba(255,255,255,0.85);font-family:var(--mono);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;}
  .reveal-text{color:#fff;font-size:17px;line-height:1.5;margin-top:12px;font-weight:500;}
  .primary-btn{
    width:100%;padding:12px;border-radius:10px;border:none;background:var(--coral);
    color:#fff;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;margin-top:18px;
  }
</style>
</head>
<body>

<div class="wrap">

  <!-- HOME SCREEN -->
  <div class="screen active" id="homeScreen">
    <div class="top-row">
      <div>
        <p class="eyebrow">7 Days Wellnest Story Quest</p>
        <h1 class="heading">เควสวันนี้ของคุณ</h1>
      </div>
      <img src="logo.png" alt="Wellnest Story logo" />
    </div>

    <div class="pet-section">
      <div class="pet-frame" id="petFrame"></div>
      <div class="pet-caption">
        <div class="pet-progress-text" id="petProgressText">0/7 วัน</div>
        <div class="pet-streak-line" id="petStreakLine">🔥 0 Day Streak</div>
      </div>
      <button class="share-pet-btn" id="sharePetBtn">📷 บันทึกรูปสัตว์เลี้ยง</button>
    </div>

    <div class="quest-card" id="eatingCard"></div>
    <div class="quest-card" id="activityCard"></div>
  </div>

  <!-- SUBCATEGORY SCREEN -->
  <div class="screen" id="subcatScreen">
    <button class="back-btn" onclick="goHome()">← กลับหน้าหลัก</button>
    <p class="eyebrow" id="subcatEyebrow"></p>
    <h1 class="heading" id="subcatHeading"></h1>
    <div id="subcatList"></div>
  </div>

  <!-- REVEAL SCREEN -->
  <div class="screen" id="revealScreen">
    <button class="back-btn" onclick="goHome()">← กลับหน้าหลัก</button>
    <p class="eyebrow">เควสของวันนี้</p>
    <h1 class="heading">พร้อมลุยหรือยัง</h1>
    <div class="reveal-card">
      <p class="reveal-tag" id="revealTag"></p>
      <p class="reveal-text" id="revealText"></p>
    </div>
    <button class="primary-btn" onclick="goHome()">รับเควสนี้</button>
  </div>

</div>

<div class="share-overlay" id="shareOverlay">
  <div class="share-preview-wrap" id="sharePreviewWrap">
    <div class="share-card" id="shareCardEl">
      <img src="logo.png" alt="Wellnest Story logo" />
      <div class="pet-frame" id="sharePetFrame"></div>
      <p class="sc-progress" id="scProgress"></p>
      <p class="sc-brand">WELLNEST STORY</p>
    </div>
  </div>
  <button class="download-share-btn" id="downloadShareBtn">บันทึก / แชร์รูปนี้</button>
  <p class="close-hint">แตะที่ว่างเพื่อปิด</p>
</div>

<script>
/* ---------- subcategory metadata ---------- */
const SUBCATS = {
  eating: [
    { key: "เพิ่ม", name: "เพิ่ม", desc: "เพิ่มอาหารดี แคลอรี่ต่ำ" },
    { key: "ลด", name: "ลด", desc: "ลดอาหารแคลอรี่สูง/ของเสีย" },
    { key: "ประเภท", name: "ประเภท", desc: "เลือกกินอาหารตามหมวดที่กำหนด" },
    { key: "สุ่มอาหาร", name: "สุ่มอาหาร", desc: "สุ่มเมนูเฉพาะให้ลองกิน" }
  ],
  activity: [
    { key: "ออกกำลังกาย", name: "ออกกำลังกาย", desc: "ท่าออกกำลังกายที่บ้าน" },
    { key: "งานบ้าน", name: "งานบ้าน", desc: "งานบ้านที่ช่วยเผาผลาญ" },
    { key: "Lifestyle", name: "Lifestyle", desc: "กิจกรรมสนุกที่เผาผลาญแคลอรี่" },
    { key: "Small Win", name: "Small Win", desc: "ขยับตัวเพิ่มในชีวิตประจำวัน" }
  ]
};
const TYPE_LABEL = { eating: "อาหาร (Eating Quest)", activity: "กิจกรรม (Activity Quest)" };

/* ---------- storage ---------- */
function todayKey(d) {
  const dt = d || new Date();
  const y = dt.getFullYear();
  const m = String(dt.getMonth() + 1).padStart(2, "0");
  const day = String(dt.getDate()).padStart(2, "0");
  return y + "-" + m + "-" + day;
}
function loadState(type) {
  try { return JSON.parse(localStorage.getItem("wq_" + type)); } catch (e) { return null; }
}
function saveState(type, state) { localStorage.setItem("wq_" + type, JSON.stringify(state)); }
function loadCompletedDates() {
  try { return JSON.parse(localStorage.getItem("wq_completed_dates")) || []; } catch (e) { return []; }
}
function saveCompletedDates(arr) { localStorage.setItem("wq_completed_dates", JSON.stringify(arr)); }

/* clear stale (yesterday's) quest state on load */
["eating", "activity"].forEach((type) => {
  const s = loadState(type);
  if (s && s.date !== todayKey()) localStorage.removeItem("wq_" + type);
});

/* self-heal: remove any completed-date entries dated after today.
   these could only exist from the old UTC-based date bug (fixed earlier),
   which sometimes recorded a "future" local date near midnight. */
(function cleanFutureCompletedDates() {
  const today = todayKey();
  const dates = loadCompletedDates();
  const cleaned = dates.filter((d) => d <= today);
  if (cleaned.length !== dates.length) saveCompletedDates(cleaned);
})();

/* ---------- quest picking ---------- */
function pickQuest(type, subcatKey) {
  let actualKey = subcatKey;
  if (subcatKey === "สุ่ม") {
    const others = SUBCATS[type].filter((s) => s.key !== "สุ่ม").map((s) => s.key);
    actualKey = others[Math.floor(Math.random() * others.length)];
  }
  const list = QUESTS[type][actualKey];
  const prevState = loadState(type);
  let choice;
  const pool = list.filter((q) => !prevState || q !== prevState.lastText);
  const usePool = pool.length > 0 ? pool : list;
  choice = usePool[Math.floor(Math.random() * usePool.length)];
  return { subcatKey: actualKey, text: choice };
}

function selectSubcat(type, subcatKey) {
  const result = pickQuest(type, subcatKey);
  const state = {
    date: todayKey(),
    subcatKey: result.subcatKey,
    text: result.text,
    lastText: result.text,
    completed: false,
    pickedFrom: subcatKey
  };
  saveState(type, state);
  showReveal(type, state);
}

/* ---------- streak ---------- */
function computeStreak() {
  const dates = new Set(loadCompletedDates());
  let streak = 0;
  let cursor = new Date();
  while (dates.has(todayKey(cursor))) {
    streak += 1;
    cursor.setDate(cursor.getDate() - 1);
  }
  return streak;
}
function checkAndRecordFullCompletion() {
  const e = loadState("eating");
  const a = loadState("activity");
  if (e && e.completed && a && a.completed) {
    const dates = loadCompletedDates();
    if (!dates.includes(todayKey())) {
      dates.push(todayKey());
      saveCompletedDates(dates);
    }
  }
}

/* ---------- screens ---------- */
function showScreen(id) {
  document.querySelectorAll(".screen").forEach((el) => el.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}
function goHome() { renderHome(); showScreen("homeScreen"); }

function openSubcatScreen(type) {
  document.getElementById("subcatScreen").className = "screen theme-" + type;
  document.getElementById("subcatEyebrow").textContent = "เลือกประเภทเควส";
  document.getElementById("subcatHeading").textContent = TYPE_LABEL[type];
  const listEl = document.getElementById("subcatList");
  listEl.innerHTML = "";
  SUBCATS[type].forEach((s) => {
    const btn = document.createElement("button");
    btn.className = "subcat-btn";
    btn.innerHTML = `<div class="name">${s.name}</div><div class="desc">${s.desc}</div>`;
    btn.onclick = () => selectSubcat(type, s.key);
    listEl.appendChild(btn);
  });
  showScreen("subcatScreen");
}

function showReveal(type, state) {
  document.getElementById("revealScreen").className = "screen theme-" + type;
  document.getElementById("revealTag").textContent = TYPE_LABEL[type] + " · " + state.subcatKey;
  document.getElementById("revealText").textContent = state.text;
  showScreen("revealScreen");
}

function toggleComplete(type) {
  const s = loadState(type);
  if (!s) return;
  s.completed = !s.completed;
  saveState(type, s);
  checkAndRecordFullCompletion();
  renderHome();
}

/* ---------- render home ---------- */
function renderCard(type) {
  const el = document.getElementById(type + "Card");
  const s = loadState(type);
  if (!s) {
    el.className = "quest-card " + type + "-idle";
    el.innerHTML = `
      <div class="cat-label">${type === "eating" ? "Eating Quest" : "Activity Quest"}</div>
      <div class="cat-title">${TYPE_LABEL[type]}</div>
      <div class="cat-sub">แตะเพื่อเลือกเควสของวันนี้</div>`;
    el.onclick = () => openSubcatScreen(type);
  } else {
    el.className = "quest-card " + type + (s.completed ? "-done" : "-active");
    el.innerHTML = `
      <div class="cat-label">${type === "eating" ? "Eating Quest" : "Activity Quest"}</div>
      <div class="cat-title">${TYPE_LABEL[type]}</div>
      <div class="quest-text">${s.text}</div>
      <span class="quest-tag">${s.subcatKey}</span>
      <div class="complete-row">
        <button class="complete-btn ${s.completed ? "done-state" : ""}" id="${type}CompleteBtn">
          ${s.completed ? "✓ ทำสำเร็จแล้ว" : "ทำสำเร็จแล้ว?"}
        </button>
      </div>
      <div class="countdown" id="${type}Countdown">เลือกเควสใหม่ได้ใน --:--:--</div>`;
    el.onclick = null;
    document.getElementById(type + "CompleteBtn").onclick = (e) => {
      e.stopPropagation();
      toggleComplete(type);
    };
  }
}

/* ---------- virtual pet (cumulative growth, placeholder shape) ---------- */
const STAGE_NAMES = ["ไข่", "กำลังฟัก", "แรกเกิด", "วัยเด็ก", "วัยรุ่น", "เติบโตเต็มที่"];
const STAGE_COLORS = ["#EFE7D8", "#F6D9AC", "#F0BC7A", "#E8A252", "#E2704F", "#3F6350"];
const STAGE_SIZES = [40, 55, 70, 85, 100, 115];

function computePetProgress() {
  const totalDays = loadCompletedDates().length;
  const stageIndex = Math.min(Math.floor(totalDays / 7), 5);
  const segmentsFilled = Math.min(totalDays - stageIndex * 7, 7);
  return { totalDays, stageIndex, segmentsFilled };
}

function todaysPetTip() {
  const start = new Date(2026, 0, 1);
  const diff = Math.floor((new Date() - start) / 86400000);
  const tips = window.PET_TIPS || [];
  if (!tips.length) return "";
  return tips[((diff % tips.length) + tips.length) % tips.length];
}

const RING_R = 74;
const RING_CIRCUMFERENCE = 2 * Math.PI * RING_R;

function ensurePetSVG(frameEl, idPrefix) {
  if (frameEl.dataset.petBuilt) return;
  frameEl.innerHTML = "";
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("viewBox", "0 0 180 180");
  svg.setAttribute("width", "180");
  svg.setAttribute("height", "180");
  svg.style.position = "absolute";
  svg.style.top = "0";
  svg.style.left = "0";

  const track = document.createElementNS(svgNS, "circle");
  track.setAttribute("cx", 90);
  track.setAttribute("cy", 90);
  track.setAttribute("r", RING_R);
  track.setAttribute("stroke", "#DAD4C8");
  track.setAttribute("stroke-width", 12);
  track.setAttribute("fill", "none");
  svg.appendChild(track);

  const progressCircle = document.createElementNS(svgNS, "circle");
  progressCircle.setAttribute("cx", 90);
  progressCircle.setAttribute("cy", 90);
  progressCircle.setAttribute("r", RING_R);
  progressCircle.setAttribute("stroke", "#E8A252");
  progressCircle.setAttribute("stroke-width", 12);
  progressCircle.setAttribute("fill", "none");
  progressCircle.setAttribute("stroke-linecap", "round");
  progressCircle.setAttribute("transform", "rotate(-90 90 90)");
  progressCircle.setAttribute("stroke-dasharray", RING_CIRCUMFERENCE);
  progressCircle.setAttribute("stroke-dashoffset", RING_CIRCUMFERENCE);
  progressCircle.style.transition = "stroke-dashoffset 0.8s ease";
  progressCircle.id = idPrefix + "ProgressCircle";
  svg.appendChild(progressCircle);
  frameEl.appendChild(svg);

  const body = document.createElement("div");
  body.className = "pet-body";
  body.id = idPrefix + "Body";
  frameEl.appendChild(body);

  frameEl.dataset.petBuilt = "1";
}

function updatePetVisual(frameEl, idPrefix, progress) {
  ensurePetSVG(frameEl, idPrefix);
  const fraction = progress.segmentsFilled / 7;
  const offset = RING_CIRCUMFERENCE * (1 - fraction);
  const progressCircle = document.getElementById(idPrefix + "ProgressCircle");
  requestAnimationFrame(() => {
    progressCircle.setAttribute("stroke-dashoffset", offset);
  });
  const body = document.getElementById(idPrefix + "Body");
  body.textContent = "Pet " + (progress.stageIndex + 1);
  body.style.fontSize = 14 + progress.stageIndex * 3 + "px";
  body.style.color = "var(--char)";
}

function renderPetFrame() {
  const progress = computePetProgress();
  updatePetVisual(document.getElementById("petFrame"), "pet", progress);

  const isMaxed = progress.stageIndex === 5 && progress.segmentsFilled >= 7;
  document.getElementById("petProgressText").textContent = isMaxed
    ? "โตเต็มที่แล้ว 🎉"
    : progress.segmentsFilled + "/7 วัน จนกว่าจะโตขึ้นอีกขั้น";
  document.getElementById("petStreakLine").textContent = "🔥 " + computeStreak() + " Day Streak";
}

function renderHome() {
  renderCard("eating");
  renderCard("activity");
  renderPetFrame();
}

/* ---------- shareable pet card ---------- */
document.getElementById("sharePetBtn").addEventListener("click", () => {
  const progress = computePetProgress();
  updatePetVisual(document.getElementById("sharePetFrame"), "share", progress);
  const isMaxed = progress.stageIndex === 5 && progress.segmentsFilled >= 7;
  document.getElementById("scProgress").textContent = isMaxed
    ? "โตเต็มที่แล้ว 🎉 · รวม " + progress.totalDays + " วัน"
    : "รวม " + progress.totalDays + " วันสำเร็จ · 🔥 " + computeStreak() + " Day Streak";
  document.getElementById("shareOverlay").classList.add("show");
  fitShareCardToWrap();
});
document.getElementById("shareOverlay").addEventListener("click", (e) => {
  if (e.target.id === "shareOverlay") document.getElementById("shareOverlay").classList.remove("show");
});
window.addEventListener("resize", fitShareCardToWrap);

function fitShareCardToWrap() {
  const wrap = document.getElementById("sharePreviewWrap");
  const card = document.getElementById("shareCardEl");
  if (!wrap || !card) return;
  const scale = wrap.clientWidth / 360;
  card.style.transform = "scale(" + scale + ")";
}

document.getElementById("downloadShareBtn").addEventListener("click", () => {
  const card = document.getElementById("shareCardEl");
  const prevTransform = card.style.transform;
  card.style.transform = "none"; // capture at true 360x640 size, ignoring on-screen fit scale

  html2canvas(card, { backgroundColor: null, scale: 3, useCORS: true })
    .then((canvas) => {
      card.style.transform = prevTransform;
      canvas.toBlob((blob) => {
        if (!blob) {
          fallbackDownload(canvas);
          return;
        }
        const file = new File([blob], "wellnest-pet-progress.png", { type: "image/png" });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          navigator.share({ files: [file], title: "Wellnest Story" }).catch(() => {
            // user cancelled the share sheet, or share failed — fall back to direct download
            fallbackDownload(canvas);
          });
        } else {
          fallbackDownload(canvas);
        }
      }, "image/png");
    })
    .catch(() => {
      card.style.transform = prevTransform;
      alert("สร้างรูปไม่สำเร็จ กรุณาลองใหม่อีกครั้ง");
    });
});

function fallbackDownload(canvas) {
  const link = document.createElement("a");
  link.download = "wellnest-pet-progress.png";
  link.href = canvas.toDataURL("image/png");
  link.click();
}

/* ---------- countdown to midnight ---------- */
function msUntilMidnight() {
  const now = new Date();
  const next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0);
  return next - now;
}
function formatHMS(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = String(Math.floor(totalSec / 3600)).padStart(2, "0");
  const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, "0");
  const s = String(totalSec % 60).padStart(2, "0");
  return h + ":" + m + ":" + s;
}
function tickCountdown() {
  const remaining = msUntilMidnight();
  if (remaining <= 1000) {
    ["eating", "activity"].forEach((type) => {
      const s = loadState(type);
      if (s && s.date !== todayKey()) localStorage.removeItem("wq_" + type);
    });
    renderHome();
    return;
  }
  ["eating", "activity"].forEach((type) => {
    const el = document.getElementById(type + "Countdown");
    if (el) el.textContent = "เลือกเควสใหม่ได้ใน " + formatHMS(remaining);
  });
}
setInterval(tickCountdown, 1000);
tickCountdown();

renderHome();
</script>
